# Шаг scrape: см. Camunda 8 Self-Managed — «Camunda components metrics» (Prometheus, polling).
# https://docs.camunda.io/docs/self-managed/operational-guides/monitoring/metrics/
#
# Формат scrape_config: официальная конфигурация Prometheus.
# https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: camunda-orchestration
    scrape_interval: 30s
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - orchestration:9600
        labels:
          component: orchestration

  - job_name: camunda-connectors
    scrape_interval: 30s
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - connectors:8080
        labels:
          component: connectors
