apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: platform
    - name: camunda
  sourceRef:
    kind: GitRepository
    name: camunda8-onprem
  path: ./apps/headlamp
